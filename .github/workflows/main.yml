name: Main - Analyse et build

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Deux merges rapprochés passent l'un après l'autre, sans s'annuler
concurrency:
  group: main-pipeline
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/${{ vars.IMAGE_NAME }}

jobs:
  # ─────────────────────── 3. Sonar complet (bloquant) ───────────────────────
  sonar:
    name: Analyse Sonar complète
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Démarrer le proxy Cloudflare Access
        env:
          SONAR_UPSTREAM: ${{ secrets.SONAR_HOST_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash .github/scripts/sonar-proxy.sh start

      # Même projet Sonar que develop (choix du chef) : la dernière analyse remplace la précédente.
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000
        with:
          # qualitygate.wait : le job échoue si le Quality Gate est rouge
          args: >
            -Dsonar.projectKey=tensorunit-video-stream
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

      # En cas d'échec de l'analyse : affiche la cause exacte dans le log et le résumé du run
      # (conditions de la Quality Gate avec valeur et seuil, problèmes avec fichier et ligne,
      # ou token refusé / Sonar injoignable). Doit passer avant l'arrêt du proxy.
      - name: Afficher la cause de l'échec Sonar
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: tensorunit-video-stream
        run: bash .github/scripts/sonar-gate-report.sh

      - name: Arrêter le proxy
        if: always()
        run: bash .github/scripts/sonar-proxy.sh stop

  # ─────────────────────── 4. Build complet + push Harbor ───────────────────────
  build:
    name: Build & push Harbor
    needs: sonar
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Libérer de l'espace disque
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h /

      - name: Calculer le tag (JJMM.AAAA.NN)
        id: tag
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          PREFIX="$(TZ=Africa/Dakar date +%d%m.%Y)."   # ex : 0411.2026.

          if OUT=$(skopeo list-tags --creds "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" "docker://${IMAGE}" 2>&1); then
            TAGS=$(echo "$OUT" | jq -r '.Tags[]?')
          elif echo "$OUT" | grep -qiE 'not found|name unknown|NAME_UNKNOWN'; then
            TAGS=""
          else
            echo "Impossible de lister les tags Harbor :"; echo "$OUT"; exit 1
          fi

          # Plus grand numéro d'ordre du jour pour la prod, puis +1. Les tags de develop
          # (JJMMAAAANN, sans points) ne correspondent pas et sont ignorés.
          # Points protégés (\.) : dans grep, « . » veut dire « n'importe quel caractère ».
          PREFIX_RE="${PREFIX//./\\.}"
          LAST=$(printf '%s\n' "$TAGS" | grep -E "^${PREFIX_RE}[0-9]{2,}$" | sed 's/^.*\.//' | sort -n | tail -n1 || true)
          NEXT=$(printf '%02d' $(( 10#${LAST:-0} + 1 )))
          TAG="${PREFIX}${NEXT}"

          echo "Tag calculé : ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Reconstruit du début à la fin : pas de cache, images de base re-téléchargées.
      # Aucune variable d'application : la configuration vient de Dockhand au démarrage.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: openvidu-dashboard
          file: openvidu-dashboard/dashboard-ce/docker/Dockerfile
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          no-cache: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}

      - name: Installer regctl
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/regctl" \
            https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64
          echo "8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd  $RUNNER_TEMP/regctl" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/regctl" /usr/local/bin/regctl

      # Cloudflare refuse les requêtes > 100 Mo : l'image est envoyée par morceaux de 50 Mo
      - name: Envoyer l'image vers Harbor (morceaux de 50 Mo)
        env:
          HOST: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          REF: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          regctl registry set "$HOST" --blob-chunk 52428800 --blob-max 52428800
          echo "$HARBOR_PASSWORD" | regctl registry login "$HOST" -u "$HARBOR_USERNAME" --pass-stdin
          regctl image import "$REF" "$RUNNER_TEMP/image.tar"
          rm -f "$RUNNER_TEMP/image.tar"

      - name: Annoncer l'image prête
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          MSG="Image ${IMAGE}:${TAG} prête sur Harbor. Pour la mettre en production : coller le tag ${TAG} dans la stack de production de Dockhand."
          echo "### ✅ ${MSG}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            jq -n --arg c "$MSG" '{content: $c}' \
              | curl -sS --fail -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" >/dev/null \
              || echo "::warning::Notification Discord non envoyée"
          fi
