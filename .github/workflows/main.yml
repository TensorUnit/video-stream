name: Main - Build & Deploy

# Chaîne main (seule branche de ce dépôt, copie d'OpenVidu) : SonarQube (non bloquant),
# build de l'image du dashboard OpenVidu (openvidu-dashboard/dashboard-ce) et envoi dans
# Harbor, puis déploiement sur le serveur via Dockhand.
#
# Dépôt public (fork d'un projet public) : les journaux des workflows sont visibles par
# tous. Aucun secret ni réponse détaillée de Dockhand n'y est affiché.
#
# À configurer dans GitHub (Settings > Secrets and variables > Actions) :
#   Variables : HARBOR_REGISTRY, HARBOR_PROJECT, IMAGE_NAME
#   Secrets   : HARBOR_USERNAME, HARBOR_PASSWORD, SONAR_TOKEN, SONAR_HOST_URL,
#               DOCKHAND_WEBHOOK_URL, DOCKHAND_WEBHOOK_SECRET,
#               CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/main.env'   # le commit du bot ne relance pas la CI

# Par défaut, les jobs ne peuvent que lire le dépôt. Seul le job deploy peut écrire.
permissions:
  contents: read

env:
  IMAGE: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/${{ vars.IMAGE_NAME }}

jobs:
  # ───────────────────────── Analyse SonarQube (non bloquante) ─────────────────────────
  sonar:
    name: Analyse SonarQube
    runs-on: ubuntu-latest
    continue-on-error: true   # un échec ici ne bloque pas le déploiement en dev
    # Une nouvelle analyse annule celle en cours : seule la dernière version du code compte
    concurrency:
      group: main-sonar
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # historique complet pour une analyse Sonar pertinente

      # Proxy local qui ajoute les en-têtes Cloudflare Access à chaque requête du scanner
      - name: Démarrer le proxy Cloudflare Access
        env:
          SONAR_UPSTREAM: ${{ secrets.SONAR_HOST_URL }}      # ex: https://sonar.ton-domaine.com
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          SONAR_UPSTREAM="${SONAR_UPSTREAM%/}"               # retire un éventuel / final
          SONAR_HOSTNAME="${SONAR_UPSTREAM#https://}"
          SONAR_HOSTNAME="${SONAR_HOSTNAME%%/*}"

          umask 077                                          # config lisible uniquement par le runner
          mkdir -p "$RUNNER_TEMP/cfproxy"
          cat > "$RUNNER_TEMP/cfproxy/nginx.conf" <<EOF
          events {}
          http {
            server {
              listen 127.0.0.1:9000;
              client_max_body_size 100m;
              location / {
                proxy_pass ${SONAR_UPSTREAM};
                proxy_ssl_server_name on;
                proxy_http_version 1.1;
                proxy_set_header Host ${SONAR_HOSTNAME};
                proxy_set_header CF-Access-Client-Id ${CF_ID};
                proxy_set_header CF-Access-Client-Secret ${CF_SECRET};
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
              }
            }
          }
          EOF

          docker run -d --name cfproxy --network host \
            -v "$RUNNER_TEMP/cfproxy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine

      # Vérifie que Access laisse passer (sinon on récupère la page de login HTML)
      - name: Vérifier l'accès à Sonar via le proxy
        run: |
          for i in $(seq 1 15); do
            if curl -sS http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "Sonar joignable via Cloudflare Access ✅"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Sonar injoignable via le proxy (token Access refusé ou Sonar down)"
          curl -sS -o /dev/null -w "Code HTTP reçu : %{http_code}\n" http://127.0.0.1:9000/api/system/status || true
          docker logs cfproxy || true
          exit 1

      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000    # passe par le proxy, plus directement par Sonar

      - name: Arrêter le proxy et supprimer la config
        if: always()
        run: |
          docker rm -f cfproxy 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/cfproxy"

  # ───────────────────────── Build & push Harbor ─────────────────────────
  build:
    name: Build & push Harbor
    runs-on: ubuntu-latest
    # Sérialise les builds : évite que deux push simultanés calculent le même numéro d'ordre
    concurrency:
      group: main-build
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Même étape que sur les autres projets : supprime les outils préinstallés inutiles
      # ici (.NET, Android, Haskell, CodeQL...) pour ne jamais manquer de place au build.
      - name: Libérer de l'espace disque
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h /

      - name: Calculer le tag (JJMMAAAANN)
        id: tag
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          PREFIX=$(TZ=Africa/Dakar date +%d%m%Y)

          # Liste les tags existants dans Harbor
          if OUT=$(skopeo list-tags --creds "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" "docker://${IMAGE}" 2>&1); then
            TAGS=$(echo "$OUT" | jq -r '.Tags[]?')
          elif echo "$OUT" | grep -qiE 'not found|name unknown|NAME_UNKNOWN'; then
            TAGS=""   # premier build : le repository n'existe pas encore
          else
            echo "Impossible de lister les tags Harbor :"; echo "$OUT"; exit 1
          fi

          # Plus grand numéro d'ordre du jour, puis +1
          LAST=$(printf '%s\n' "$TAGS" | grep -E "^${PREFIX}[0-9]{2,}$" | sed "s/^${PREFIX}//" | sort -n | tail -n1 || true)
          NEXT=$(printf '%02d' $(( 10#${LAST:-0} + 1 )))
          TAG="${PREFIX}${NEXT}"

          echo "Tag calculé : ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Cloudflare (devant Harbor) refuse toute requête de plus de 100 Mo. Comme sur les
      # autres projets, l'image est construite dans un fichier, puis envoyée à Harbor par
      # morceaux de 50 Mo avec regctl : aucune couche ne peut être refusée.
      # Contexte de build = openvidu-dashboard/ (racine de l'espace pnpm, voir le Dockerfile).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: openvidu-dashboard
          file: openvidu-dashboard/dashboard-ce/docker/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Installer regctl
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/regctl" \
            https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64
          echo "8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd  $RUNNER_TEMP/regctl" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/regctl" /usr/local/bin/regctl

      - name: Envoyer l'image vers Harbor (morceaux de 50 Mo)
        env:
          REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Toute couche de plus de 50 Mo est envoyée en plusieurs requêtes de 50 Mo
          regctl registry set "$REGISTRY" --blob-chunk 52428800 --blob-max 52428800
          echo "$HARBOR_PASSWORD" | regctl registry login "$REGISTRY" -u "$HARBOR_USERNAME" --pass-stdin
          regctl image import "${IMAGE}:${TAG}" "$RUNNER_TEMP/image.tar"
          rm -f "$RUNNER_TEMP/image.tar"

  # ───────────────────────── Déploiement Dockhand ─────────────────────────
  deploy:
    name: Déployer sur Dockhand
    needs: build
    runs-on: ubuntu-latest
    # Sérialise les déploiements : APP_TAG est toujours écrit dans l'ordre des builds
    concurrency:
      group: main-deploy
      cancel-in-progress: false
    permissions:
      contents: write   # pour commiter deploy/main.env
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Mettre à jour IMAGE_REPO et APP_TAG dans deploy/main.env
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          F=deploy/main.env
          mkdir -p deploy && touch "$F"

          # Remplace la ligne NOM=... si elle existe, sinon l'ajoute
          set_var() {
            if grep -q "^$1=" "$F"; then
              sed -i "s|^$1=.*|$1=$2|" "$F"
            else
              echo "$1=$2" >> "$F"
            fi
          }
          set_var IMAGE_REPO "${IMAGE}"
          set_var APP_TAG "${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          # Sur une relance, le fichier contient déjà ce tag : rien à commiter
          if git diff --cached --quiet; then
            echo "deploy/main.env déjà à jour (${TAG})"
          else
            git commit -m "deploy(main): ${TAG} [skip ci]"
          fi

          # Retry au cas où quelqu'un a poussé sur main entre-temps
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Échec du push du tag"; exit 1

      - name: Déclencher Dockhand
        env:
          DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Même format qu'un webhook GitHub : Dockhand vérifie la signature HMAC-SHA256
          # du corps avec la clé secrète. La clé elle-même n'est jamais envoyée.
          BODY='{"ref":"refs/heads/main"}'
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DOCKHAND_WEBHOOK_SECRET" | sed 's/^.*= //')"

          # Pas de --retry sur les erreurs HTTP : un nouvel appel relancerait un 2e déploiement.
          # On ne réessaie que si la connexion n'a pas pu s'établir.
          for i in $(seq 1 10); do
            HTTP=$(curl -sS --max-time 130 \
              -o resp.json -w '%{http_code}' -X POST "$DOCKHAND_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -H "X-Hub-Signature-256: $SIG" \
              -H "CF-Access-Client-Id: ${CF_ID}" \
              -H "CF-Access-Client-Secret: ${CF_SECRET}" \
              --data "$BODY") || true
            HTTP="${HTTP:-000}"
            echo "HTTP $HTTP"
            # Dépôt public : on n'affiche que le résultat et le message d'erreur, pas toute la réponse
            jq -r '"success: \(.success | tostring)", (.error // empty | "erreur: \(.)")' resp.json 2>/dev/null || true

            case "$HTTP" in
              200)
                # Dockhand répond 200 même quand le déploiement échoue : on lit "success"
                if [ "$(jq -r '.success' resp.json 2>/dev/null)" = "true" ]; then
                  exit 0
                fi
                # Dockhand synchronise déjà le dépôt (déploiement précédent pas fini) :
                # on attend la fin plutôt que d'échouer
                if jq -r '.error // empty' resp.json 2>/dev/null | grep -qi 'already in progress'; then
                  echo "Synchronisation Dockhand déjà en cours, nouvel essai dans 30 s ($i/10)"
                  sleep 30; continue
                fi
                echo "::error::Dockhand a refusé ou raté le déploiement (voir la réponse ci-dessus)"
                exit 1 ;;
              524)
                # Cloudflare coupe la réponse après 100 s, mais Dockhand continue le déploiement
                # sur le serveur. Le résultat se vérifie dans Dockhand ou avec docker ps.
                echo "::warning::Dockhand met plus de 100 s à répondre (524 Cloudflare) : déploiement lancé, résultat à vérifier sur le serveur"
                ;;
              *)
                echo "::error::Webhook Dockhand en échec (HTTP $HTTP)"
                exit 1 ;;
            esac
            exit 0
          done
          echo "::error::Dockhand est resté occupé pendant 5 minutes"; exit 1
